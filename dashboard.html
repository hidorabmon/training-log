<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training Dashboard</title><style>body{font:15px system-ui;margin:0;background:#f9f8f7;color:#2c2c2b}header,main{max-width:1100px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;background:white;border-bottom:1px solid #e6e5e3}a,button{padding:8px 12px;border:1px solid #ddd;border-radius:7px;background:white;text-decoration:none;color:#222}table{width:100%;background:white;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid #eee}.hide{display:none}</style><header><b>👔 主管訓練總覽</b><span><a id="reviews" class="hide">🧾 Independent Reviews</a> <a id="back">← 訓練記錄表</a></span></header><main><p id="status">Loading…</p><table><thead><tr><th>受訓者</th><th>訓練員</th><th>總分</th><th>最終建議</th></tr></thead><tbody id="rows"></tbody></table></main><script>const A='https://script.google.com/macros/s/AKfycbyMpdguD7BPA6VaoFD8M06LpPNvHLCURyEBa5GWNzP9f7ondvyg7kIQYA_Uq9Qy_p9jEw/exec',t=new URLSearchParams(location.search).get('token')||sessionStorage.getItem('yang_admin_token')||'';sessionStorage.setItem('yang_admin_token',t);back.href='./index.html?token='+encodeURIComponent(t);async function go(){try{let x=await fetch(A+'?action=list&token='+encodeURIComponent(t)).then(r=>r.json());if(x.role==='admin'){reviews.className='';reviews.href='./independent-reviews-v2.html?token='+encodeURIComponent(t)}let rs=await Promise.all((x.trainees||[]).map(v=>fetch(A+'?action=get&token='+encodeURIComponent(t)+'&record_id='+encodeURIComponent(v.record_id)).then(r=>r.json())));rows.innerHTML=rs.map(v=>v.record||{}).map(r=>`<tr><td>${r.trainee_name||'—'}</td><td>${r.trainer_name||'—'}</td><td>${r.grand_total||'—'}</td><td>${r.final_decision||'—'}</td></tr>`).join('');status.textContent='已更新：'+(x.role||'unknown')}catch(e){status.textContent='無法讀取資料：'+e.message}}go()</script>
