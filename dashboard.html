<!doctype html><html lang="zh-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training Dashboard</title><style>:root{--b:#2783de;--g:#46a171;--o:#d5803b;--r:#e56458;--bg:#f9f8f7;--bd:#e6e5e3;--t:#2c2c2b;--m:#7d7a75}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--t)}header{background:#fff;border-bottom:1px solid var(--bd);padding:16px 28px;display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:19px;font-weight:800}.sub,.small{font-size:12px;color:var(--m)}.actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--bd);border-radius:8px;background:#fff;padding:7px 11px;font-weight:650;text-decoration:none;color:var(--t);cursor:pointer}.btn.active{background:#e5f2fc;color:var(--b);border-color:#b0d4f3}.main{max-width:1120px;margin:auto;padding:28px 20px 60px}.notice,.card{background:#fff;border:1px solid var(--bd);border-radius:10px}.notice{padding:13px 15px;color:#365876}.notice.error{color:#933b32;background:#fce9e7}.label{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--m);margin:26px 0 10px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{padding:17px}.num{font-size:31px;font-weight:800;margin:6px 0}.blue{color:var(--b)}.green{color:var(--g)}.orange{color:var(--o)}.red{color:var(--r)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.barrow{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;margin:15px 0;font-weight:700}.track{height:10px;border-radius:20px;background:#eee;overflow:hidden}.bar{height:100%;border-radius:20px}.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}.name{font-weight:750}.pill{display:inline-block;border-radius:20px;padding:4px 8px;font-size:11px;font-weight:800;white-space:nowrap}.ready{color:var(--g);background:#e8f1ec}.review{color:#a35d1d;background:#fbebde}.risk{color:var(--r);background:#fce9e7}.neutral{color:#666;background:#f0efed}.table{overflow:auto;padding:0}.table table{width:100%;min-width:780px;border-collapse:collapse}.table th{background:#f0efed;font-size:11px;text-align:left;color:var(--m);letter-spacing:.4px}.table td,.table th{padding:12px 14px;border-bottom:1px solid var(--bd)}.tl{display:flex;gap:3px}.d{width:18px;height:18px;border-radius:4px;text-align:center;font-size:10px;line-height:18px;background:#eee;color:#aaa}.d.done{background:#e8f1ec;color:var(--g)}@media(max-width:700px){header{padding:14px}.main{padding:20px 12px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.barrow{grid-template-columns:125px 1fr 50px}.sub{display:none}.actions .btn{font-size:0;min-width:44px;text-align:center}.actions .btn::first-letter{font-size:16px}} </style><body><header><div><div class="title" id="title"></div><div class="sub" id="subtitle"></div></div><div class="actions"><button class="btn" onclick="load(true)" id="refresh"></button><button class="btn" onclick="toggleLang()" id="langBtn">🌐 EN</button><a class="btn" id="back" title="Training Log" aria-label="Training Log">📝 Training Log</a></div></header><main class="main"><div class="notice" id="notice"></div><div id="content" hidden><div class="label" id="overview"></div><div class="metrics"><div class="card"><b id="totalL"></b><div class="num blue" id="total"></div><span class="small" id="totalD"></span></div><div class="card"><b id="progressL"></b><div class="num orange" id="progress"></div><span class="small" id="progressD"></span></div><div class="card"><b id="readyL"></b><div class="num green" id="ready"></div><span class="small" id="readyD"></span></div><div class="card"><b id="riskL"></b><div class="num red" id="risk"></div><span class="small" id="riskD"></span></div></div><div class="label" id="ratesL"></div><div class="card" id="rates"></div><div class="label" id="followL"></div><div class="grid"><div class="card" id="follow"></div><div class="card"><b id="insightT"></b><p class="small" id="insight" style="font-size:14px;line-height:1.65"></p></div></div><div class="label" id="detailsL"></div><div class="card table"><table><thead><tr><th id="hName"></th><th id="hProgress"></th><th id="hP1"></th><th id="hP2"></th><th id="hP3"></th><th id="hTotal"></th><th id="hDecision"></th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>const URL='https://script.google.com/macros/s/AKfycbyMpdguD7BPA6VaoFD8M06LpPNvHLCURyEBa5GWNzP9f7ondvyg7kIQYA_Uq9Qy_p9jEw/exec',token=(()=>{let t=new URLSearchParams(location.search).get('token');if(t)sessionStorage.setItem('yang_admin_token',t);return t||sessionStorage.getItem('yang_admin_token')||''})(),q=s=>document.querySelector(s),n=x=>Number(x)||0,CACHE_KEY='dashboardRecords:'+token;let lang='zh',records=[];const S={zh:{title:'👔 主管訓練總覽',sub:'Machine Operator 新人訓練計畫 · 即時資料',refresh:'↻ 重新整理',back:'📝 Training Log',loading:'正在讀取已授權的訓練紀錄…',cached:'使用已載入資料；按重新整理可更新 Google Sheet 資料',updated:'已更新',overview:'目前訓練概況',total:'受訓者總數',totalD:'目前可檢視的訓練紀錄',progress:'訓練進行中',progressD:'尚未完成最終建議',ready:'可獨立作業',readyD:'最終建議已準備好',risk:'需主管關注',riskD:'需延長、支援或處理',rates:'階段達標率',follow:'需要決策或追蹤',details:'個別訓練進度',insT:'💡 主管閱讀重點',ins:'本頁快速顯示整體進度與需要決策的對象。個別受訓者的分數、Trainer Notes 與實作證據，仍應在 Training Log 的 Summary 中共同檢視。重點是及早確認是否符合要求、需要複評，或更適合其他安排。',name:'受訓者／訓練者',prog:'階段進度',decision:'目前建議',p1:'Phase 1',p2:'Phase 2',p3:'Phase 3',totalH:'總分',readyS:'可獨立作業',reviewS:'延長監督訓練',riskS:'需要進一步處理',waitS:'等待最終建議',none:'目前沒有待追蹤的受訓紀錄。',fail:'無法讀取訓練資料。請確認有效 Token、Apps Script 部署與網路連線。'},en:{title:'👔 Supervisor Training Dashboard',sub:'Machine Operator New Hire Programme · Live data',refresh:'↻ Refresh',back:'📝 Training Log',loading:'Loading authorised training records…',cached:'Using loaded data; press Refresh to update from Google Sheet',updated:'Updated',overview:'CURRENT TRAINING OVERVIEW',total:'Total trainees',totalD:'Records you can access',progress:'In progress',progressD:'Final recommendation pending',ready:'Ops ready',readyD:'Ready for independent operation',risk:'Needs attention',riskD:'Extension, support or action',rates:'PHASE PASS RATES',follow:'DECISIONS & FOLLOW-UP',details:'INDIVIDUAL PROGRESS',insT:'💡 Supervisor focus',ins:'Use this page to identify progress and decisions quickly. Review individual scores, Trainer Notes and practical evidence together in the Training Log Summary. The aim is to find the right fit, not simply fill one role.',name:'Trainee / Trainer',prog:'Progress',decision:'Recommendation',p1:'Phase 1',p2:'Phase 2',p3:'Phase 3',totalH:'Total',readyS:'Ops ready',reviewS:'Continue supervised training',riskS:'Further action needed',waitS:'Final decision pending',none:'No training records currently need follow-up.',fail:'Unable to load training data. Check the Token, Apps Script deployment and network connection.'}};function decision(r){let d=String(r.final_decision||'').toLowerCase();if(d.includes('ready'))return['ready','readyS'];if(d.includes('continue')||d.includes('support'))return['review','reviewS'];if(d.includes('further'))return['risk','riskS'];return[n(r.grand_total)?'review':'neutral','waitS']}function toggleLang(){lang=lang==='zh'?'en':'zh';render()}function pill(r){let[a,k]=decision(r);return `<span class="pill ${a}">${S[lang][k]}</span>`}function render(){let s=S[lang];q('#title').textContent=s.title;q('#subtitle').textContent=s.sub;q('#refresh').textContent=s.refresh;q('#langBtn').textContent=lang==='zh'?'🌐 EN':'🌐 中文';q('#back').textContent=s.back;q('#back').href='./index.html'+(token?'?token='+encodeURIComponent(token):'');['overview','ratesL','followL','detailsL','totalL','totalD','progressL','progressD','readyL','readyD','riskL','riskD','insightT','insight','hName','hProgress','hP1','hP2','hP3','hTotal','hDecision'].forEach(id=>q('#'+id).textContent=s[{overview:'overview',ratesL:'rates',followL:'follow',detailsL:'details',totalL:'total',totalD:'totalD',progressL:'progress',progressD:'progressD',readyL:'ready',readyD:'readyD',riskL:'risk',riskD:'riskD',insightT:'insT',insight:'ins',hName:'name',hProgress:'prog',hP1:'p1',hP2:'p2',hP3:'p3',hTotal:'totalH',hDecision:'decision'}[id]]);if(!records.length)return;let ready=records.filter(r=>decision(r)[0]=='ready').length,risk=records.filter(r=>decision(r)[0]=='risk').length,progress=records.filter(r=>!r.final_decision).length;q('#total').textContent=records.length;q('#ready').textContent=ready;q('#risk').textContent=risk;q('#progress').textContent=progress;let stages=[['p1',45,36,'phase1_total','var(--g)'],['p2',60,48,'phase2_total','var(--o)'],['p3',21,17,'phase3_total','var(--r)']];q('#rates').innerHTML=stages.map(([k,max,pass,key,color])=>{let a=records.filter(r=>n(r[key])),p=a.filter(r=>n(r[key])>=pass).length,pct=a.length?Math.round(p/a.length*100):0;return `<div class="barrow"><b>${s[k]}</b><div class="track"><div class="bar" style="width:${pct}%;background:${color}"></div></div><span>${pct}% <small>${p}/${a.length}</small></span></div>`}).join('');let follow=records.filter(r=>decision(r)[0]!='ready');q('#follow').innerHTML=follow.length?follow.map(r=>`<div class="item"><div><div class="name">${r.trainee_name||'—'}</div><div class="small">${r.machine_line||'—'} · ${r.trainer_name||'—'} · ${n(r.grand_total)||'—'} /126</div></div>${pill(r)}</div>`).join(''):`<div class="small">${s.none}</div>`;q('#rows').innerHTML=records.map(r=>{let days=['p1_d1_score','p1_d2_score','p1_d3_score','p2_d4_score','p2_d5_score','p2_d6_score','p2_d7_score','p3_dw2_score'];return `<tr><td><b>${r.trainee_name||'—'}</b><span class="small">${r.machine_line||'—'} · ${r.trainer_name||'—'}</span></td><td><div class="tl">${days.map(k=>`<i class="d ${n(r[k])?'done':''}">${n(r[k])?'✓':'—'}</i>`).join('')}</div><span class="small">D1 D2 D3 D4 D5 D6 D7 W2</span></td><td>${n(r.phase1_total)||'—'} /45</td><td>${n(r.phase2_total)||'—'} /60</td><td>${n(r.phase3_total)||'—'} /21</td><td><b>${n(r.grand_total)||'—'} /126</b></td><td>${pill(r)}</td></tr>`}).join('')}function useCache(){try{const cached=JSON.parse(sessionStorage.getItem(CACHE_KEY)||'null');if(cached&&Array.isArray(cached.records)){records=cached.records;q('#notice').className='notice';q('#notice').textContent=`${S[lang].cached}: ${new Date(cached.time).toLocaleString()}`;q('#content').hidden=false;render();return true}}catch(e){}return false}async function load(force=false){if(!force&&useCache())return;q('#content').hidden=true;q('#notice').className='notice';q('#notice').textContent=S[lang].loading;try{let l=await fetch(`${URL}?action=list&token=${encodeURIComponent(token)}`).then(x=>x.json());records=(await Promise.all((l.trainees||[]).map(t=>fetch(`${URL}?action=get&record_id=${encodeURIComponent(t.record_id)}&token=${encodeURIComponent(token)}`).then(x=>x.json())))).map(x=>x.record).filter(Boolean);sessionStorage.setItem(CACHE_KEY,JSON.stringify({time:Date.now(),records}));q('#notice').textContent=`${S[lang].updated}: ${new Date().toLocaleString()} · ${records.length}`;q('#content').hidden=false;render()}catch(e){q('#notice').className='notice error';q('#notice').textContent=S[lang].fail}}load();</script>
