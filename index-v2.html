<!doctype html><html lang="zh-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training Log V2 Test</title><style>:root{--b:#2783de;--g:#46a171;--o:#d5803b;--r:#e56458;--bg:#f9f8f7;--bd:#e6e5e3;--t:#2c2c2b;--m:#7d7a75}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--t)}header{background:#fff;border-bottom:1px solid var(--bd);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-weight:800;font-size:19px}.sub{font-size:12px;color:var(--m);margin-top:3px}.btn{border:1px solid var(--bd);border-radius:8px;padding:8px 12px;background:#fff;text-decoration:none;color:var(--t);font-weight:650;cursor:pointer}.primary{background:var(--b);border-color:var(--b);color:#fff}.main{max-width:900px;margin:auto;padding:26px 18px 60px}.notice,.card{background:#fff;border:1px solid var(--bd);border-radius:10px}.notice{padding:14px 16px;background:#e5f2fc;border-color:#c2dff6;color:#315878;line-height:1.6}.card{padding:20px;margin-top:16px}.card h2{font-size:16px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-size:12px;font-weight:750;color:var(--m)}input,select,textarea{border:1px solid var(--bd);border-radius:7px;padding:9px 10px;font:inherit;background:#fff}textarea{min-height:105px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.review{padding:14px 0;border-bottom:1px solid var(--bd)}.review:last-child{border:0}.meta{font-size:12px;color:var(--m);margin-top:3px}.tag{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:750;background:#f0efed;color:#555}.yes{background:#fce9e7;color:var(--r)}.empty{color:var(--m);text-align:center;padding:22px}.small{font-size:12px;color:var(--m)}@media(max-width:600px){.grid{grid-template-columns:1fr}header{padding:14px}.main{padding:18px 12px}.field.full{grid-column:auto}}</style><body><header><div><div class="title">🧪 Training Log V2 — 獨立觀察測試版</div><div class="sub">不會修改目前穩定版 Training Log 或 Dashboard</div></div><a class="btn" id="back">← 返回穩定版</a></header><main class="main"><div class="notice"><b>測試目的：</b>驗證「訓練者以外」的觀察者，能否以具名、具日期、可追溯的方式補充意見，供主管作為最終決策的參考。<br><span class="small">本測試版的觀察資料暫時儲存在目前瀏覽器；確認流程與欄位後，才會建立正式 Google Sheets／Apps Script 儲存機制。</span></div><section class="card"><h2>新增獨立觀察</h2><div class="grid"><div class="field full"><label>受訓者</label><select id="trainee"><option>正在讀取已授權名單…</option></select></div><div class="field"><label>觀察者姓名</label><input id="observer" placeholder="例如：Yang"></div><div class="field"><label>角色／身份</label><select id="role"><option>專案負責人</option><option>資深操作員</option><option>主管</option><option>臨時協作同仁</option><option>其他</option></select></div><div class="field"><label>觀察日期</label><input id="date" type="date"></div><div class="field"><label>觀察情境</label><input id="context" placeholder="例如：共同操作一整班"></div><div class="field full"><label>具體觀察（記錄實際看到的事實與行為）</label><textarea id="note" placeholder="例如：基礎補料步驟已說明後，仍需多次提示才能完成；遇到不確定狀況時未主動查證。"></textarea></div><div class="field"><label>對崗位適配的意見</label><select id="recommendation"><option>符合目前崗位要求</option><option>需持續觀察</option><option>建議安排複評</option><option>目前不適合此崗位</option></select></div><div class="field"><label>是否需主管關注</label><select id="attention"><option value="no">否</option><option value="yes">是</option></select></div></div><div class="actions"><button class="btn" onclick="clearForm()">清除</button><button class="btn primary" onclick="saveReview()">儲存測試觀察</button></div></section><section class="card"><h2>已記錄的獨立觀察</h2><div id="reviews"></div></section></main><script>const API='https://script.google.com/macros/s/AKfycbyMpdguD7BPA6VaoFD8M06LpPNvHLCURyEBa5GWNzP9f7ondvyg7kIQYA_Uq9Qy_p9jEw/exec';const token=(()=>{let t=new URLSearchParams(location.search).get('token');if(t)sessionStorage.setItem('yang_admin_token',t);return t||sessionStorage.getItem('yang_admin_token')||''})();const key='training_log_v2_independent_observations';const $=id=>document.getElementById(id);$('date').value=new Date().toISOString().slice(0,10);$('back').href='./index.html'+(token?'?token='+encodeURIComponent(token):'');function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function list(){return JSON.parse(localStorage.getItem(key)||'[]')}function render(){let a=list();$('reviews').innerHTML=a.length?a.slice().reverse().map((x,i)=>`<div class="review"><b>${esc(x.trainee)}</b> <span class="tag ${x.attention==='yes'?'yes':''}">${x.recommendation}${x.attention==='yes'?' · 需主管關注':''}</span><div class="meta">${esc(x.observer)} · ${esc(x.role)} · ${x.date} · ${esc(x.context)}</div><div style="margin-top:8px">${esc(x.note)}</div><div class="actions"><button class="btn" onclick="removeReview(${a.length-1-i})">刪除</button></div></div>`).join(''):'<div class="empty">尚未新增獨立觀察。</div>'}function removeReview(i){let a=list();a.splice(i,1);localStorage.setItem(key,JSON.stringify(a));render()}function clearForm(){['observer','context','note'].forEach(id=>$(id).value='');$('role').selectedIndex=0;$('recommendation').selectedIndex=0;$('attention').value='no'}function saveReview(){let trainee=$('trainee').value,observer=$('observer').value.trim(),note=$('note').value.trim();if(!trainee||!observer||!note){alert('請先填寫受訓者、觀察者姓名與具體觀察。');return}let a=list();a.push({trainee,observer,role:$('role').value,date:$('date').value,context:$('context').value,note,recommendation:$('recommendation').value,attention:$('attention').value});localStorage.setItem(key,JSON.stringify(a));clearForm();render()}async function load(){try{let data=await fetch(`${API}?action=list&token=${encodeURIComponent(token)}`).then(r=>r.json());let t=data.trainees||[];$('trainee').innerHTML=t.length?t.map(x=>`<option>${esc(x.trainee_name)}${x.trainer_name?' — '+esc(x.trainer_name):''}</option>`).join(''):'<option value="">沒有可讀取的受訓者</option>'}catch(e){$('trainee').innerHTML='<option value="">無法讀取名單，請確認 Token</option>'}}load();render();</script>
