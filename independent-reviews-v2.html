<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Independent Reviews V2</title><style>body{margin:0;background:#f9f8f7;font:14px Arial;color:#2c2c2b}header{padding:16px 24px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;gap:8px}.main{max-width:820px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:9px;padding:18px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}input,select,textarea{padding:9px;border:1px solid #ddd;border-radius:6px;font:inherit}textarea{min-height:90px}.btn,.role-badge{padding:8px 12px;border:1px solid #ddd;background:#fff;border-radius:7px;cursor:pointer;text-decoration:none;color:#2c2c2b}.role-badge{cursor:default;font-weight:800;background:#fff4d6;color:#7a5200;border-color:#efd07a}.primary{background:#2783de;color:#fff;border-color:#2783de}.actions{text-align:right;margin-top:14px}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.review{padding:12px 0;border-bottom:1px solid #eee}.meta{font-size:12px;color:#777}.notice{padding:12px;background:#e5f2fc;border-radius:8px;color:#315878}.err{background:#fce9e7;color:#a33}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}header{padding:14px;align-items:flex-start}.top-actions{justify-content:flex-end}.top-actions .btn,.role-badge{font-size:0;min-width:44px;text-align:center}.top-actions .btn::before,.role-badge::before{font-size:16px}.top-actions .btn span{display:none}.role-badge::before{content:'👑'}#dashboardBack::before{content:'🏠'}#back::before{content:'📝'}}</style><body><header><b>🧾 Independent Reviews V2</b><div class="top-actions"><span class="role-badge" title="Admin mode" aria-label="Admin mode">👑 Admin</span><a id="dashboardBack" class="btn" title="Dashboard" aria-label="Dashboard"><span>🏠 Dashboard</span></a><a id="back" class="btn" title="Training Log" aria-label="Training Log"><span>📝 Training Log</span></a></div></header><main class="main"><div id="notice" class="notice">Loading authorised trainees…</div><section class="card"><div class="field"><label>Trainee</label><select id="trainee" onchange="loadReviews()"></select></div></section><section class="card"><h3>Add independent observation</h3><div class="grid"><div class="field"><label>Observer name</label><input id="observer"></div><div class="field"><label>Role</label><select id="role"><option>Team Leader</option><option>Senior Operator</option><option>Junior Operator</option><option>Packer</option><option>Blender</option><option>Other</option></select></div><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Context</label><input id="context"></div><div class="field full"><label>Specific observation</label><textarea id="note"></textarea></div><div class="field"><label>Recommendation</label><select id="rec"><option>Needs ongoing observation</option><option>Recommend reassessment</option><option>Suitable for current role</option><option>Not suitable for current role</option></select></div><div class="field"><label>Supervisor attention</label><select id="attention"><option value="no">No</option><option value="yes">Yes</option></select></div></div><div class="actions"><button class="btn primary" onclick="save()">Save observation</button></div></section><section class="card"><h3 id="historyTitle">Observation history</h3><div id="history"></div></section></main><script>const API='https://script.google.com/macros/s/AKfycbyMpdguD7BPA6VaoFD8M06LpPNvHLCURyEBa5GWNzP9f7ondvyg7kIQYA_Uq9Qy_p9jEw/exec',q=x=>document.getElementById(x);const token=(()=>{let t=new URLSearchParams(location.search).get('token')||sessionStorage.getItem('yang_admin_token')||'';if(t)sessionStorage.setItem('yang_admin_token',t);return t})();let trainees=[];q('date').value=new Date().toISOString().slice(0,10);q('back').href='./index.html'+(token?'?token='+encodeURIComponent(token):'');q('dashboardBack').href='./dashboard.html'+(token?'?token='+encodeURIComponent(token):'');function msg(s,e=false){q('notice').textContent=s;q('notice').className=e?'notice err':'notice'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{let d=await fetch(`${API}?action=list&token=${encodeURIComponent(token)}`).then(r=>r.json());trainees=d.trainees||[];if(!trainees.length)throw Error('No authorised trainees');q('trainee').innerHTML=trainees.map(t=>`<option value="${t.record_id}">${esc(t.trainee_name)} — ${esc(t.trainer_name)}</option>`).join('');msg(`Loaded ${trainees.length} authorised trainee records.`);loadReviews()}catch(e){msg('Unable to load trainees. Use an Admin Token and confirm Apps Script V3.8 is deployed.',true)}}async function loadReviews(){let id=q('trainee').value,t=trainees.find(x=>x.record_id===id);q('historyTitle').textContent='Observation history | '+(t?t.trainee_name:'');q('history').textContent='Loading…';try{let d=await fetch(`${API}?action=reviews_list&record_id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`).then(r=>r.json());if(d.error)throw Error(d.error);q('history').innerHTML=d.reviews.length?d.reviews.slice().reverse().map(r=>`<div class="review"><b>${esc(r.observer_name)}</b> · ${esc(r.observer_role)}<div class="meta">${r.observation_date} · ${esc(r.observation_context)} · ${esc(r.recommendation)}${r.requires_supervisor_attention==='yes'?' · ⚠️ Supervisor attention':''}</div><div style="margin-top:7px">${esc(r.observation_note)}</div></div>`).join(''):'<span class="meta">No observations for this trainee.</span>'}catch(e){q('history').textContent='Unable to load history: '+e.message}}async function save(){let t=trainees.find(x=>x.record_id===q('trainee').value),observer=q('observer').value.trim(),note=q('note').value.trim();if(!t||!observer||!note)return alert('Enter observer name and specific observation.');let body={action:'review_create',token,record_id:t.record_id,trainee_name:t.trainee_name,observer_name:observer,observer_role:q('role').value,observation_date:q('date').value,observation_context:q('context').value,observation_note:note,recommendation:q('rec').value,requires_supervisor_attention:q('attention').value};try{let d=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)}).then(r=>r.json());if(d.result!=='success')throw Error(d.error||'Unknown error');q('observer').value='';q('context').value='';q('note').value='';msg('Independent observation saved to Google Sheets.');loadReviews()}catch(e){msg('Save failed: '+e.message,true)}}load();</script>
