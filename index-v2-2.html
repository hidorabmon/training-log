<!doctype html><html lang="zh-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Independent Observations V2</title><style>body{margin:0;background:#f9f8f7;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#2c2c2b}header{background:#fff;border-bottom:1px solid #e6e5e3;padding:15px 24px;display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:18px;font-weight:800}.sub,.muted{font-size:12px;color:#7d7a75}.btn{padding:8px 11px;border:1px solid #e6e5e3;border-radius:8px;background:#fff;cursor:pointer;font-weight:650;text-decoration:none;color:#2c2c2b}.active,.primary{background:#2783de;color:#fff;border-color:#2783de}.main{max-width:850px;margin:auto;padding:24px 16px 50px}.card,.notice{background:#fff;border:1px solid #e6e5e3;border-radius:10px;padding:18px;margin-top:14px}.notice{background:#e5f2fc;border-color:#c2dff6;color:#315878}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}label{font-size:12px;font-weight:750;color:#7d7a75}input,select,textarea{font:inherit;border:1px solid #e6e5e3;border-radius:7px;padding:9px}textarea{min-height:95px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.review{border-bottom:1px solid #e6e5e3;padding:13px 0}.review:last-child{border:0}.tag{font-size:11px;padding:3px 8px;border-radius:20px;background:#f0efed;font-weight:750}.red{background:#fce9e7;color:#e56458}.empty{text-align:center;color:#7d7a75;padding:20px}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}header{padding:14px}}</style><body><header><div><div class="title" id="title"></div><div class="sub" id="sub"></div></div><div><button class="btn" id="zh" onclick="lang='zh';ui()">中文</button><button class="btn" id="en" onclick="lang='en';ui()">EN</button><a class="btn" id="back"></a></div></header><main class="main"><div class="notice" id="notice"></div><section class="card"><div class="field"><label id="traineeL"></label><select id="trainee" onchange="render()"></select></div></section><section class="card"><h2 id="formTitle" style="font-size:16px;margin-top:0"></h2><div class="grid"><div class="field"><label id="observerL"></label><input id="observer"></div><div class="field"><label id="roleL"></label><select id="role"><option>Team Leader</option><option>Senior Operator</option><option>Junior Operator</option><option>Packer</option><option>Blender</option><option>Other</option></select></div><div class="field"><label id="dateL"></label><input id="date" type="date"></div><div class="field"><label id="contextL"></label><input id="context"></div><div class="field full"><label id="noteL"></label><textarea id="note"></textarea></div><div class="field"><label id="recL"></label><select id="rec"><option value="observe">Needs ongoing observation</option><option value="review">Recommend reassessment</option><option value="fit">Suitable for current role</option><option value="notfit">Not suitable for current role</option></select></div><div class="field"><label id="attentionL"></label><select id="attention"><option value="no">No</option><option value="yes">Yes</option></select></div></div><div class="actions"><button class="btn" id="clear" onclick="clearForm()"></button><button class="btn primary" id="save" onclick="save()"></button></div></section><section class="card"><h2 id="historyTitle" style="font-size:16px;margin-top:0"></h2><div id="history"></div></section></main><script>const API='https://script.google.com/macros/s/AKfycbyMpdguD7BPA6VaoFD8M06LpPNvHLCURyEBa5GWNzP9f7ondvyg7kIQYA_Uq9Qy_p9jEw/exec',token=(()=>{let t=new URLSearchParams(location.search).get('token');if(t)sessionStorage.setItem('yang_admin_token',t);return t||sessionStorage.getItem('yang_admin_token')||''})(),$=x=>document.getElementById(x),key='training_v2_observations',esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let lang=sessionStorage.getItem('training_lang')||'zh';const T={zh:{title:'🧪 獨立觀察 V2 測試版',sub:'每位受訓者只顯示自己的歷史觀察',notice:'測試資料暫存於目前瀏覽器；穩定後才會接入 Google Sheets。',back:'← 穩定版',trainee:'受訓者',form:'新增獨立觀察',observer:'觀察者姓名',role:'身份',date:'觀察日期',context:'觀察情境',note:'具體觀察（事實與行為）',rec:'崗位適配意見',attention:'是否需主管關注',clear:'清除',save:'儲存觀察',history:'已記錄的獨立觀察｜',empty:'這位受訓者尚無獨立觀察。',yes:'是',no:'否',observe:'需持續觀察',review:'建議安排複評',fit:'符合目前崗位要求',notfit:'目前不適合此崗位'},en:{title:'🧪 Independent Observations V2',sub:'Each trainee shows only their own observation history',notice:'Test records are stored in this browser until the workflow is approved for Google Sheets.',back:'← Stable version',trainee:'Trainee',form:'Add independent observation',observer:'Observer',role:'Role',date:'Observation date',context:'Context',note:'Specific observation (facts and behaviour)',rec:'Role-fit recommendation',attention:'Supervisor attention required',clear:'Clear',save:'Save observation',history:'Independent observations | ',empty:'No independent observations for this trainee.',yes:'Yes',no:'No',observe:'Needs ongoing observation',review:'Recommend reassessment',fit:'Suitable for current role',notfit:'Not suitable for current role'}};function all(){return JSON.parse(localStorage.getItem(key)||'[]')}function ui(){sessionStorage.setItem('training_lang',lang);let t=T[lang];['title','sub','notice','trainee','observer','role','date','context','note','rec','attention','clear','save'].forEach(id=>$(id==='trainee'?'traineeL':id==='observer'?'observerL':id==='role'?'roleL':id==='date'?'dateL':id==='context'?'contextL':id==='note'?'noteL':id==='rec'?'recL':id==='attention'?'attentionL':id).textContent=t[id]);$('formTitle').textContent=t.form;$('back').textContent=t.back;$('back').href='./index.html'+(token?'?token='+encodeURIComponent(token):'');$('zh').className='btn '+(lang==='zh'?'active':'');$('en').className='btn '+(lang==='en'?'active':'');render()}function render(){let t=T[lang],name=$('trainee').value;$('historyTitle').textContent=t.history+(name||'—');let a=all().filter(x=>x.trainee===name);$('history').innerHTML=a.length?a.slice().reverse().map(x=>`<div class="review"><b>${esc(x.observer)}</b> <span class="tag ${x.attention==='yes'?'red':''}">${t[x.rec]}${x.attention==='yes'?' · '+t.yes:''}</span><div class="muted">${esc(x.role)} · ${x.date} · ${esc(x.context)}</div><div style="margin-top:7px">${esc(x.note)}</div></div>`).join(''):`<div class="empty">${t.empty}</div>`}function clearForm(){['observer','context','note'].forEach(id=>$(id).value='')}function save(){let trainee=$('trainee').value,observer=$('observer').value.trim(),note=$('note').value.trim();if(!trainee||!observer||!note)return alert(lang==='zh'?'請填寫受訓者、觀察者與具體觀察。':'Please complete trainee, observer and observation.');let a=all();a.push({trainee,observer,note,role:$('role').value,date:$('date').value,context:$('context').value,rec:$('rec').value,attention:$('attention').value});localStorage.setItem(key,JSON.stringify(a));clearForm();render()}async function load(){try{let d=await fetch(`${API}?action=list&token=${encodeURIComponent(token)}`).then(r=>r.json()),a=d.trainees||[];$('trainee').innerHTML=a.length?a.map(x=>`<option>${esc(x.trainee_name)}${x.trainer_name?' — '+esc(x.trainer_name):''}</option>`).join(''):'<option value="">No authorised trainees</option>'}catch(e){$('trainee').innerHTML='<option value="">Unable to load trainees</option>'}render()}$('date').value=new Date().toISOString().slice(0,10);ui();load();</script>
