<!doctype html><html lang="zh-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Independent Observations V2</title><style>body{margin:0;background:#f9f8f7;font:14px Arial,sans-serif;color:#2c2c2b}header{background:#fff;border-bottom:1px solid #e6e5e3;padding:15px 22px;display:flex;justify-content:space-between}.title{font-size:18px;font-weight:800}.sub,.meta{font-size:12px;color:#777}.btn{padding:8px 11px;border:1px solid #ddd;border-radius:7px;background:#fff;cursor:pointer;text-decoration:none;color:#222}.active,.primary{background:#2783de;color:#fff;border-color:#2783de}.main{max-width:820px;margin:auto;padding:22px 14px}.card,.notice{background:#fff;border:1px solid #e6e5e3;border-radius:10px;padding:18px;margin-top:14px}.notice{background:#e5f2fc}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}label{font-size:12px;font-weight:bold;color:#666}input,select,textarea{padding:9px;border:1px solid #ddd;border-radius:7px;font:inherit}textarea{min-height:95px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.review{padding:12px 0;border-bottom:1px solid #eee}.review:last-child{border:0}.tag{font-size:11px;background:#f0efed;border-radius:12px;padding:3px 8px}.attention{background:#fce9e7;color:#c44}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style><body><header><div><div id="title" class="title"></div><div id="sub" class="sub"></div></div><div><button id="zh" class="btn" onclick="setLang('zh')">中文</button><button id="en" class="btn" onclick="setLang('en')">EN</button><a id="back" class="btn"></a></div></header><main class="main"><div id="notice" class="notice"></div><section class="card"><div class="field"><label id="traineeL"></label><select id="trainee" onchange="render()"></select></div></section><section class="card"><h2 id="form"></h2><div class="grid"><div class="field"><label id="observerL"></label><input id="observer"></div><div class="field"><label id="roleL"></label><select id="role"><option>Team Leader</option><option>Senior Operator</option><option>Junior Operator</option><option>Packer</option><option>Blender</option><option>Other</option></select></div><div class="field"><label id="dateL"></label><input id="date" type="date"></div><div class="field"><label id="contextL"></label><input id="context"></div><div class="field full"><label id="noteL"></label><textarea id="note"></textarea></div><div class="field"><label id="recL"></label><select id="rec"><option value="observe">Needs ongoing observation</option><option value="review">Recommend reassessment</option><option value="fit">Suitable for current role</option><option value="notfit">Not suitable for current role</option></select></div><div class="field"><label id="attentionL"></label><select id="attention"><option value="no">No</option><option value="yes">Yes</option></select></div></div><div class="actions"><button id="clear" class="btn" onclick="clearForm()"></button><button id="save" class="btn primary" onclick="saveReview()"></button></div></section><section class="card"><h2 id="historyTitle"></h2><div id="history"></div></section></main><script>const API='https://script.google.com/macros/s/AKfycbyMpdguD7BPA6VaoFD8M06LpPNvHLCURyEBa5GWNzP9f7ondvyg7kIQYA_Uq9Qy_p9jEw/exec';const token=(()=>{const t=new URLSearchParams(location.search).get('token')||sessionStorage.getItem('yang_admin_token')||'';if(t)sessionStorage.setItem('yang_admin_token',t);return t})();const $=x=>document.getElementById(x),KEY='v2reviews3';var lang=sessionStorage.getItem('training_lang')||'zh';const T={zh:{title:'🧪 獨立觀察 V2 測試版',sub:'依受訓者分開查看歷史觀察',notice:'測試資料暫存於目前瀏覽器；確認後才會接入 Google Sheets。',back:'← 返回穩定版',trainee:'受訓者',form:'新增獨立觀察',observer:'觀察者姓名',role:'身份',date:'觀察日期',context:'觀察情境',note:'具體觀察（事實與行為）',rec:'崗位適配意見',attention:'是否需主管關注',clear:'清除',save:'儲存觀察',history:'已記錄的獨立觀察｜',empty:'這位受訓者尚無獨立觀察。',yes:'是',observe:'需持續觀察',review:'建議安排複評',fit:'符合目前崗位要求',notfit:'目前不適合此崗位'},en:{title:'🧪 Independent Observations V2',sub:'View observation history separately for each trainee',notice:'Test records are saved only in this browser until approved for Google Sheets.',back:'← Back to stable version',trainee:'Trainee',form:'Add independent observation',observer:'Observer',role:'Role',date:'Observation date',context:'Observation context',note:'Specific observation (facts and behaviour)',rec:'Role-fit recommendation',attention:'Supervisor attention required',clear:'Clear',save:'Save observation',history:'Independent observations | ',empty:'No independent observations for this trainee.',yes:'Yes',observe:'Needs ongoing observation',review:'Recommend reassessment',fit:'Suitable for current role',notfit:'Not suitable for current role'}};function all(){return JSON.parse(localStorage.getItem(KEY)||'[]')}function setLang(x){lang=x;sessionStorage.setItem('training_lang',x);ui()}function ui(){const t=T[lang];['title','sub','notice','form','clear','save'].forEach(x=>$(x).textContent=t[x]);[['traineeL','trainee'],['observerL','observer'],['roleL','role'],['dateL','date'],['contextL','context'],['noteL','note'],['recL','rec'],['attentionL','attention']].forEach(([id,k])=>$(id).textContent=t[k]);$('zh').className='btn '+(lang==='zh'?'active':'');$('en').className='btn '+(lang==='en'?'active':'');$('back').textContent=t.back;$('back').href='./index.html'+(token?'?token='+encodeURIComponent(token):'');render()}function render(){const t=T[lang],name=$('trainee').value,a=all().filter(x=>x.trainee===name);$('historyTitle').textContent=t.history+(name||'—');$('history').innerHTML=a.length?a.slice().reverse().map(x=>`<div class="review"><b>${x.observer}</b> <span class="tag ${x.attention==='yes'?'attention':''}">${t[x.rec]}${x.attention==='yes'?' · '+t.yes:''}</span><div class="meta">${x.role} · ${x.date} · ${x.context}</div><div style="margin-top:7px">${x.note}</div></div>`).join(''):`<div class="meta">${t.empty}</div>`}function clearForm(){['observer','context','note'].forEach(x=>$(x).value='')}function saveReview(){if(!$('trainee').value||!$('observer').value||!$('note').value)return alert(lang==='zh'?'請填寫受訓者、觀察者與具體觀察。':'Please complete trainee, observer and observation.');const a=all();a.push({trainee:$('trainee').value,observer:$('observer').value,note:$('note').value,role:$('role').value,date:$('date').value,context:$('context').value,rec:$('rec').value,attention:$('attention').value});localStorage.setItem(KEY,JSON.stringify(a));clearForm();render()}async function load(){try{const d=await fetch(`${API}?action=list&token=${encodeURIComponent(token)}`).then(x=>x.json()),a=d.trainees||[];$('trainee').innerHTML=a.map(x=>`<option>${x.trainee_name}${x.trainer_name?' — '+x.trainer_name:''}</option>`).join('')||'<option value="">No authorised trainees</option>'}catch(e){$('trainee').innerHTML='<option value="">Unable to load trainees</option>'}render()}$('date').value=new Date().toISOString().slice(0,10);ui();load();</script>
