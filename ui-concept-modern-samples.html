<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modern UI Concepts｜Training System</title>
<style>
:root{--ink:#172033;--muted:#6f7787;--line:rgba(20,31,52,.11);--blue:#3b82f6;--green:#18a058;--amber:#d97706;--red:#ef4444;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:14px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef2f8;color:var(--ink)}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:18px}.hero h1{margin:0;font-size:30px;letter-spacing:-.04em}.hero p{margin:6px 0 0;color:var(--muted)}.switch{display:flex;gap:8px;flex-wrap:wrap}.switch a{border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;border-radius:999px;padding:9px 12px;font-weight:800}.concept{margin-top:26px;border-radius:30px;overflow:hidden;border:1px solid var(--line);box-shadow:0 24px 70px rgba(15,23,42,.12)}.concept-title{padding:18px 22px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.concept-title h2{margin:0;font-size:17px}.concept-title span{color:var(--muted);font-size:12px;font-weight:700}.app{min-height:620px;padding:22px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.mark{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:24px}.title h3{margin:0;font-size:24px;letter-spacing:-.035em}.title p{margin:4px 0 0;color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--line);border-radius:14px;padding:9px 12px;background:#fff;font-weight:800;color:var(--ink)}.role{font-weight:900;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px}.card small{display:block;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}.num{font-size:34px;font-weight:950;letter-spacing:-.05em;margin-top:6px}.main{display:grid;grid-template-columns:320px 1fr;gap:16px}.list{display:flex;flex-direction:column;gap:10px}.person{padding:14px;border-radius:18px;border:1px solid var(--line);background:#fff}.person b{display:block}.person span{color:var(--muted);font-size:12px}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900;margin-top:10px}.blue{color:#1d4ed8;background:#dbeafe}.green{color:#047857;background:#d1fae5}.amber{color:#92400e;background:#fef3c7}.red{color:#b91c1c;background:#fee2e2}.detail h4{font-size:22px;margin:0 0 8px}.bars{display:grid;gap:12px;margin-top:18px}.barrow{display:grid;grid-template-columns:90px 1fr 60px;gap:10px;align-items:center;font-weight:800}.track{height:10px;background:rgba(15,23,42,.08);border-radius:999px;overflow:hidden}.bar{height:100%;border-radius:999px;background:linear-gradient(90deg,#60a5fa,#22c55e)}.brief{margin-top:16px;padding:18px;border-radius:20px;background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(16,185,129,.08));border:1px solid rgba(59,130,246,.18)}.brief h5{margin:0 0 8px;font-size:16px}.feedback{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.fb{padding:12px;border-radius:16px;background:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.7)}
/* concept A */.a{background:radial-gradient(circle at 15% 10%,#dbeafe 0,#eef6ff 28%,#f8fafc 58%)}.a .mark{background:#111827;color:#fff}.a .role{color:#7a5200}.a .card,.a .person,.a .detail{box-shadow:0 18px 50px rgba(15,23,42,.08)}
/* concept B */.b{background:#0b1020;color:#eef2ff}.b .title p,.b .person span,.b .card small{color:#a8b3cf}.b .mark{background:linear-gradient(135deg,#8b5cf6,#06b6d4);color:white}.b .btn,.b .card,.b .person{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.13);color:#eef2ff;backdrop-filter:blur(18px)}.b .detail{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.13);color:#eef2ff}.b .track{background:rgba(255,255,255,.12)}.b .brief{background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(6,182,212,.12));border-color:rgba(255,255,255,.16)}.b .fb{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
/* concept C */.c{background:#fbf7ef}.c .mark{background:#f97316;color:#fff;border-radius:50%}.c .btn,.c .card,.c .person,.c .detail{border:2px solid #1f2937;box-shadow:6px 6px 0 #1f2937}.c .card,.c .person,.c .detail{background:#fffdf7}.c .brief{background:#fff7d6;border:2px solid #1f2937;box-shadow:6px 6px 0 #1f2937}.c .fb{border:1px solid #1f2937;background:#fff}.c .bar{background:#f97316}
@media(max-width:800px){.hero,.top{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:repeat(2,1fr)}.main{grid-template-columns:1fr}.feedback{grid-template-columns:1fr}.nav{justify-content:flex-start}.concept{border-radius:22px}.app{padding:16px}.title h3{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><div><h1>Modern UI Concepts</h1><p>Static visual samples only. No Google Sheet / Apps Script connection.</p></div><div class="switch"><a href="#a">A Soft SaaS</a><a href="#b">B Dark Glass</a><a href="#c">C Bold Card</a></div></div>
  <section class="concept" id="a"><div class="concept-title"><h2>A｜Soft SaaS / 乾淨專業</h2><span>最接近正式系統、風險最低</span></div><div class="app a">__APP__</div></section>
  <section class="concept" id="b"><div class="concept-title"><h2>B｜Dark Glass / AI 科技感</h2><span>最像 modern AI dashboard</span></div><div class="app b">__APP__</div></section>
  <section class="concept" id="c"><div class="concept-title"><h2>C｜Bold Card / 年輕醒目</h2><span>辨識度高、比較有個性</span></div><div class="app c">__APP__</div></section>
</div>
<script>
const sample=`<div class="top"><div class="brand"><div class="mark">📝</div><div class="title"><h3>Machine Operator Training</h3><p>新人訓練紀錄 · Dashboard preview · <span class="role">👑 Admin</span></p></div></div><div class="nav"><button class="btn">↻ Refresh</button><button class="btn">🌐 EN</button><button class="btn">🧭 Decision Center</button><button class="btn">🧾 Reviews</button></div></div><div class="grid"><div class="card"><small>Total trainees</small><div class="num">5</div></div><div class="card"><small>In progress</small><div class="num">3</div></div><div class="card"><small>Ready</small><div class="num">1</div></div><div class="card"><small>Needs attention</small><div class="num">2</div></div></div><div class="main"><aside class="list"><div class="person"><b>Happy</b><span>Syed · b2 · Afternoon Shift</span><br><em class="pill amber">Practical reassessment</em></div><div class="person"><b>Mary</b><span>Syed · b3 · Night Shift</span><br><em class="pill red">Evidence incomplete</em></div><div class="person"><b>Amritpreet</b><span>Heana · Linapack</span><br><em class="pill green">Strong progress</em></div></aside><article class="card detail"><h4>Happy｜Decision Summary</h4><p>Phase 1 is marked as Pass, while Phase 2 and Phase 3 need additional evidence before final role confirmation.</p><div class="bars"><div class="barrow"><span>Phase 1</span><div class="track"><div class="bar" style="width:73%"></div></div><b>33/45</b></div><div class="barrow"><span>Phase 2</span><div class="track"><div class="bar" style="width:38%"></div></div><b>23/60</b></div><div class="barrow"><span>Phase 3</span><div class="track"><div class="bar" style="width:19%"></div></div><b>4/21</b></div></div><div class="brief"><h5>✨ AI Decision Brief</h5><p>Recommend a standardized practical reassessment before making the final role decision.</p><div class="feedback"><div class="fb">✅ Early training foundation</div><div class="fb">⚠️ Later-stage evidence limited</div><div class="fb">🔍 Review suggests reassessment</div></div></div></article></div>`;
document.querySelectorAll('.app').forEach(x=>x.innerHTML=sample);
</script>
</body>
</html>
