<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Decision Test｜Training Colors</title><style>:root{--blue:#2783de;--blue-soft:#e5f2fc;--green:#46a171;--green-soft:#e8f1ec;--orange:#d5803b;--orange-soft:#fbebde;--red:#e56458;--red-soft:#fce9e7;--ink:#2c2c2b;--muted:#7d7a75;--canvas:#f9f8f7;--surface:#fff;--line:#e6e5e3;--soft:#f0efed}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select,textarea,input{font:inherit}.topbar{position:sticky;top:0;z-index:20;background:#fffffff5;border-bottom:1px solid var(--line)}.topbar-inner{max-width:1180px;margin:auto;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--blue-soft);color:var(--blue);font-size:20px}.brand h1{font-size:17px;line-height:1.25;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0 0}.nav{display:flex;gap:6px}.nav button{min-height:44px;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 12px;font-weight:700;color:var(--muted)}.nav .active{background:var(--blue-soft);color:var(--blue);border-color:#b0d4f3}.shell{max-width:1180px;margin:auto;padding:28px 28px 64px}.status{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid #b0d4f3;border-radius:10px;background:var(--blue-soft);color:#365876}.status.error{background:var(--red-soft);border-color:#f0b9b4;color:#933b32}.status small,.small{color:var(--muted)}.eyebrow{margin:30px 0 10px;color:var(--muted);font-size:11px;font-weight:850;letter-spacing:1.1px;text-transform:uppercase}.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px #0000000d,0 4px 12px #0000000a}.metric{padding:17px}.metric .value{font-size:30px;font-weight:850;margin:4px 0}.metric small{color:var(--muted)}.blue{color:var(--blue)}.green{color:var(--green)}.orange{color:var(--orange)}.red{color:var(--red)}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px}.queue{padding:10px}.queue-head{padding:8px 8px 12px}.queue-head h2{font-size:17px;margin:0}.queue-head p{color:var(--muted);font-size:13px;margin:3px 0 0}.person{width:100%;text-align:left;border:1px solid transparent;border-radius:10px;background:transparent;padding:13px;cursor:pointer;color:var(--ink)}.person+.person{margin-top:4px}.person.active{background:var(--blue-soft);border-color:#b0d4f3}.person-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.person small{display:block;color:var(--muted);margin-top:4px}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}.pill.high{background:var(--red-soft);color:#a64037}.pill.ready{background:var(--orange-soft);color:#94551f}.pill.good{background:var(--green-soft);color:#317654}.brief{overflow:hidden}.brief-hero{padding:24px 26px;background:linear-gradient(135deg,#fff,var(--blue-soft));border-bottom:1px solid var(--line)}.brief-hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.brief-hero h2{font-size:25px;line-height:1.25;margin:4px 0 6px}.brief-hero p{color:var(--muted);margin:0}.rec{margin-top:18px;padding:14px 16px;border-left:4px solid var(--red);border-radius:8px;background:var(--red-soft)}.rec b{display:block;color:#8e332c}.brief-body{padding:24px 26px}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.summary-box{padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--canvas)}.summary-box span{display:block;font-size:12px;color:var(--muted)}.summary-box b{font-size:18px}.section{margin-top:28px}.section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.section h3{font-size:18px;margin:0}.section-title small{color:var(--muted)}.phase{display:grid;grid-template-columns:90px 1fr 82px 82px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.track{height:9px;background:var(--soft);border-radius:20px;overflow:hidden}.bar{height:100%;border-radius:20px}.threshold{color:var(--muted);font-size:12px}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:12px}.evidence-card{padding:16px;border:1px solid var(--line);border-radius:10px}.evidence-card h4{margin:0 0 8px}.evidence-card ul{margin:0;padding-left:18px;color:var(--muted)}.risk-table{width:100%;border-collapse:collapse}.risk-table th,.risk-table td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}.risk-table th{font-size:11px;color:var(--muted);background:var(--canvas)}.decision-form{padding:18px;background:var(--canvas);border:1px solid var(--line);border-radius:10px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field select,.field input,.field textarea{width:100%;border:1px solid #d6d4d1;border-radius:8px;background:#fff;padding:10px 11px;min-height:44px}.field textarea{min-height:92px}.full{grid-column:1/-1}.form-note{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:14px}.form-note p{font-size:12px;color:var(--muted)}.primary{border:0;border-radius:8px;background:#b7b5b1;color:#fff;font-weight:800;padding:10px 16px}.empty{padding:36px;text-align:center;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}.queue-list{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.grid-4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.topbar-inner{padding:12px 16px;align-items:flex-start;flex-direction:column}.nav{width:100%;flex-wrap:wrap}.nav button:first-child{display:none}.shell{padding:20px 16px 48px}.status{align-items:flex-start;flex-direction:column}.queue-list,.grid-4,.summary-grid,.evidence,.fields{grid-template-columns:1fr}.phase{grid-template-columns:72px 1fr 64px}.threshold{display:none}.brief-hero,.brief-body{padding:20px}.brief-hero-top{display:block}.form-note{align-items:stretch;flex-direction:column}.primary{width:100%}}</style></head><body><header class="topbar"><div class="topbar-inner"><div class="brand"><div class="brand-mark">📊</div><div><h1>Manager Decision Center</h1><p>Machine Operator Training Dashboard · Test Version</p></div></div><nav class="nav"><button>訓練總覽</button><button class="active">Decision Summary</button></nav></div></header><main class="shell"><div class="status" id="notice"><div><b>測試版本</b>　正在準備 Decision Summary。</div><small id="updated"></small></div><div class="eyebrow">Decision overview</div><section class="grid-4"><div class="card metric"><b>等待主管決策</b><div class="value orange" id="awaiting">0</div><small>Ready for Decision</small></div><div class="card metric"><b>高風險個案</b><div class="value red" id="highRisk">0</div><small>需要優先處理</small></div><div class="card metric"><b>需要後續追蹤</b><div class="value blue" id="followup">0</div><small>Follow-up Required</small></div><div class="card metric"><b>已完成決策</b><div class="value green" id="finalized">0</div><small>Final</small></div></section><div class="eyebrow">Awaiting manager decision</div><section class="layout"><aside class="card queue"><div class="queue-head"><h2>決策佇列</h2><p>依風險與評估日期排序</p></div><div class="queue-list" id="queue"></div></aside><article class="card brief" id="brief"><div class="empty">正在載入 Decision Summary…</div></article></section></main><script src="./dashboard-decision-live.js"></script></body></html>
