<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Role Test</title><style>body{margin:0;background:#f9f8f7;color:#2c2c2b;font:16px system-ui}main{max-width:680px;margin:48px auto;padding:24px}.card{background:#fff;border:1px solid #e6e5e3;border-radius:12px;padding:24px}input,button,a{padding:10px 14px;border-radius:8px;border:1px solid #ddd;font:inherit}button{background:#2783de;color:#fff;border-color:#2783de}a{display:inline-block;text-decoration:none;color:#fff;background:#2783de}#reviews[hidden]{display:none}pre{background:#191919;color:#fff;padding:12px;border-radius:8px;overflow:auto}</style><main><h1>Dashboard Admin Access Test</h1><div class="card"><p>Enter your current Admin or Trainer token.</p><input id="token" type="password" placeholder="Token"><button onclick="load()">Check access</button><p id="status"></p><a id="reviews" hidden>🧾 Independent Reviews</a><pre id="log">Waiting</pre></div></main><script>const API='https://script.google.com/macros/s/AKfycbyMpdguD7BPA6VaoFD8M06LpPNvHLCURyEBa5GWNzP9f7ondvyg7kIQYA_Uq9Qy_p9jEw/exec';async function load(){try{let t=token.value.trim(),d=await fetch(`${API}?action=list&token=${encodeURIComponent(t)}`).then(r=>r.json());status.textContent=`Role: ${d.role||'missing'}`;reviews.hidden=d.role!=='admin';reviews.href=`./independent-reviews-v2.html?token=${encodeURIComponent(t)}`;log.textContent=JSON.stringify(d,null,2)}catch(e){status.textContent='Failed: '+e.message}}</script>
